# CI for Buffr G2P — backend type-check and mobile tests.
# Runs on push and pull_request to main.
# Repo layout: backend/ (Node/Express), mobile/ (Expo/React Native); no root package.json.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Backend – install and type-check
        run: |
          cd backend
          npm ci
          npm run type-check

      - name: Mobile – install and run tests
        run: |
          cd mobile
          npm ci
          npm test -- --passWithNoTests
