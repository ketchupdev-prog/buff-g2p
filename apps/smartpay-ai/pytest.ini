[pytest]
# Allow async test functions without explicit @pytest.mark.asyncio.
asyncio_mode = auto

# Test discovery
testpaths = tests smartpay_ai/tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Output configuration
addopts = 
    -v
    --ignore=../../smartpay/backend_python
    -m "not database and not analytics and not live and not agent and not integration"
    --strict-markers
    --tb=short
    --color=yes
    --disable-warnings

# Custom markers for test categorization
markers =
    unit: Unit tests (fast, no external dependencies)
    integration: Integration tests (may need database)
    live: Live integration tests (require running backend services)
    slow: Slow tests that take more than 1 second
    database: Tests requiring database connection
    analytics: Tests for DuckDB analytics
    agent: Tests requiring LLM API access
    security: Security-related tests

# Environment variables
env_files = 
    .env

